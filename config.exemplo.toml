# config.exemplo.toml — modelo para o config.toml desta máquina.
#
# Copie para `config.toml` e descomente só o que precisar mudar:
#
#     cp config.exemplo.toml config.toml
#
# Tudo aqui está com o valor padrão do código, então um arquivo com todas as
# linhas comentadas equivale a não ter arquivo nenhum. A precedência é
# padrões de src/rag/config.py → config.toml → flags da linha de comando.
#
# `python3 main.py config` mostra o que está em vigor e de onde cada valor veio.
# `python3 main.py config --salvar` grava aqui do lado, em config.toml, o que
# você ajustou pelo menu ou por flag. `--sem-config` ignora o arquivo.
#
# Este arquivo é gerado a partir das dataclasses de src/rag/config.py. Para
# regerá-lo depois de acrescentar um campo:
#
#     python3 -c "import sys; sys.path.insert(0,'src'); from rag.config import escrever_exemplo; escrever_exemplo()"

# Onde vivem os artefatos gerados. Tudo abaixo de `data/`, tudo gitignored.
[caminhos]
# dados = "data"   # padrão: a pasta data/ na raiz do repositório
# arquivo_chunks = "chunks.jsonl"
# exportacao_acervo = "acervo_dspace"

# Coleta do corpus de teste na UESP (namespace Lore, via API MediaWiki).
[download]
# api_url = "https://en.uesp.net/w/api.php"
# namespace = "Lore"
# tamanho_minimo = 80
# candidatos = 50000
# titulos_por_lote = 50
# lotes_paralelos = 8
# timeout = 30
# user_agent = "IA-Freiriana-RAG/2.0 (protótipo acadêmico; contato via repositório)"

# Extração de texto dos PDFs do acervo, com OCR das páginas que são só imagem.
[extracao]
# idioma = "por"
# minimo_de_caracteres_por_pagina = 50
# cobertura_de_pagina_escaneada = 0.9
# processos = 0
# motor = "kraken"

# Kraken, o motor de OCR do eScriptorium, no container `rag-kraken` (Containerfile.kraken).
[kraken]
# imagem = "localhost/rag-kraken"
# modelo = "htrmopo/d96caf7a-122e-5576-ab2b-a246c4e64221/catmus-print-fondue-large.mlmodel"
# paginas_por_chamada = 20
# dpi = 300

# Regras que dão tipo às regiões do texto posicionado (carimbo, ruído dos furos).
[regioes]
# tipos_ignorados = "carimbo|ruido"
# marcar_carimbo = true
# carimbos = "INSTITUTO PAULO FREIRE|Rua Cerro Corá, 550 2.º andar cj. 22|Tel: (11) 3021-5536 Fax: (11) 3021-5589|05061-100 - São Paulo - SP - Brasil|E-mail: ipf@paulofreire.org"
# zona_do_carimbo = 0.15
# semelhanca_do_carimbo = 0.6
# minimo_de_linhas_do_carimbo = 2
# marcar_ruido = true
# maximo_de_caracteres_do_ruido = 3
# margem_do_ruido = 0.07

# Regras do texto depois do OCR (`normalizacao_texto.py`). Cada uma desligável, e medida.
[normalizacao]
# juntar_hifen_marcado = true
# juntar_hifen_comum = true
# juntar_sem_hifen = true
# minimo_da_junta_sem_hifen = 5
# juntar_linhas = true
# espaco_apos_pontuacao = true
# exemplos_por_regra = 5

# Nível de qualidade do OCR por página, sem transcrição de referência (`qualidade_ocr.py`).
[qualidade]
# limiar_bom = 0.03
# limiar_regular = 0.1
# minimo_de_palavras = 20
# confianca_baixa = 0.5
# fracao_hesitante = 0.1
# limiar_de_idioma = 0.25
# idiomas_testados = "por|eng|spa|fra"
# palavras_suspeitas = 10

# Corte dos documentos em trechos.
[chunking]
# estrategia = "paragrafo_agrupado"
# tamanho_minimo = 60
# tamanho_maximo = 2000

# Geração de vetores. `dimensao` precisa bater com a saída do modelo.
[embedding]
# ollama_url = "http://localhost:11434"
# modelo = "bge-m3"
# dimensao = 1024
# tamanho_lote = 16
# lotes_paralelos = 4
# timeout = 120

# Banco vetorial. `colecao` é o que muda ao trocar de corpus.
[vetorial]
# url = "http://localhost:6333"
# colecao = "uesp_lore_agrupado_2000"
# timeout = 60

# Recuperação.
[busca]
# k = 8
# score_minimo = 0.0
# limiar_relativo = 0.9
# k_maximo = 20
# k_minimo = 5
# reordenar = true
# candidatos_para_reordenar = 50
# hibrido = false
# peso_denso = 3

# Geração da resposta final.
[geracao]
# ollama_url = "http://localhost:11434"
# modelo = "qwen2.5:7b"
# temperatura = 0.2
# timeout = 300
# streaming = true
# num_ctx = 8192
# reserva_para_resposta = 1024

# Modelo de reordenação (cross-encoder).
[reordenacao]
# modelo = "BAAI/bge-reranker-v2-m3"
# dispositivo = "auto"
# precisao = "auto"
# tamanho_lote = 16
# tamanho_maximo = 512

# Reformulação e decomposição da pergunta antes da busca.
[intermediacao]
# ligada = true
# decompor = true
# maximo_de_subconsultas = 4
# limiar_de_redundancia = 0.95
# k_por_subconsulta = 8
# constante_rrf = 60
# incluir_pergunta_original = true
# minimo_de_caracteres = 25
# diversidade_por_documento = 0

# Diálogo multi-turno — problematizar antes de responder.
[sessao]
# problematizar = true
# classificar_com_modelo = true
# perguntas_ancoradas = true
# maximo_de_rodadas = 1
# maximo_de_perguntas = 3

# Memória entre perguntas, no modo conversa (CLI sem pergunta, e o menu).
[conversa]
# ligada = true
# turnos_lembrados = 3
# turnos_no_prompt = 2
# caracteres_por_resposta = 600

# Quanto o pipeline exige do hardware. Dois modos, e só dois.
[carga]
# modo = "total"

# Marco pedagógico. O conteúdo mora em `marcos/*.md`, versionado no git.
[marco]
# ativo = "generico"
