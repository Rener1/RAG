services:
  qdrant:
    image: docker.io/qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"   # API REST + painel web (http://localhost:6333/dashboard)
      - "6334:6334"   # API gRPC (mais rápido, opcional usar por enquanto)
    volumes:
      - ./data/qdrant_storage:/qdrant/storage:Z   # dados persistem aqui, fora do container
    restart: unless-stopped
